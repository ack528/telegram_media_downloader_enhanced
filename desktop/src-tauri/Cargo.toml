[package]
name = "tdl-desktop"
version = "1.0.0"
description = "Desktop shell for Telegram Media Downloader Enhanced"
authors = ["Telegram Media Downloader Enhanced contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tdl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
